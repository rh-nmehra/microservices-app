apiVersion: networking.istio.io/v1alpha3
kind: VirtualService
metadata:
  name: ingressgateway
spec:
  hosts:
  - '*'
  gateways:
  - ingressgateway
  http:
  http:
  - route:
    - destination:
        host: phonebook-service
        subset: v1
      weight: 50
    - destination:
         host: phonebook-service
         subset: v2
      weight: 50
