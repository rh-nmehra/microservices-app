apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: phonebook-hpa
  namespace: phonebook-v1-ns # Ensure this matches your namespace
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: phonebook-app-deploy
  minReplicas: 1
  maxReplicas: 2
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 10
